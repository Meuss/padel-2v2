name: Deploy client to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # lets you re-run manually (e.g. after setting VITE_SERVER_URL)

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes cancel older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build client
        env:
          # Pages serves from /<repo>/, so the asset base must match the repo name.
          VITE_BASE: /${{ github.event.repository.name }}/
          # wss:// URL of the deployed server — set as a repo Variable (see README).
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
