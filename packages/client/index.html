<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meuss Padel Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;700&display=swap"
    />
    <!-- Page shell and in-world overlays only; the HUD styles live in src/hud/hud.css. -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      canvas {
        display: block;
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="9" fill="none" stroke="%23ff5566" stroke-width="2"/><circle cx="17" cy="17" r="2" fill="%23ff5566"/><path d="M17 1v7M17 26v7M1 17h7M26 17h7" stroke="%23ff5566" stroke-width="2"/></svg>')
            17 17,
          crosshair;
      }
      #reactions {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #reactions .reaction {
        position: absolute;
        width: 68px;
        height: 68px;
        transform: translate(-50%, -100%);
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
        animation: pop 0.22s ease-out;
      }
      @keyframes pop {
        from {
          transform: translate(-50%, -100%) scale(0.3);
          opacity: 0;
        }
        to {
          transform: translate(-50%, -100%) scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="join-up">
    <div id="app"></div>
    <div id="labels"></div>
    <div id="reactions"></div>
    <div id="reactbar"></div>
    <div id="conn" class="bug-panel" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="conn-label">Reconnecting…</span>
    </div>
    <div id="topright">
      <div id="replaytag" role="status" aria-label="Replay">
        <div class="rp-tag"><span class="rp-dot" aria-hidden="true"></span>Replay</div>
        <div class="rp-skip"><kbd>Enter</kbd> to skip</div>
      </div>
      <div id="watching" class="bug-panel"><span class="n" id="watching-n">0</span><span class="label">watching</span></div>
      <button id="resetbtn" class="ghost-btn" type="button" title="Propose resetting the set (all players must accept)">
        Reset set
      </button>
      <button id="mutebtn" class="ghost-btn" type="button" title="Sound (M)" aria-label="Sound" aria-pressed="true">
        <svg class="mute-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="speaker" d="M3.5 9.25h3.75L12.5 5v14l-5.25-4.25H3.5z" />
          <path class="waves" d="M15.75 9a4.25 4.25 0 0 1 0 6M18.5 6.25a8.25 8.25 0 0 1 0 11.5" />
          <path class="slash" d="M3 3.5l18 17" />
        </svg>
      </button>
    </div>
    <button id="takeseat" class="primary-btn" type="button">Take seat</button>
    <div id="votepanel" class="vote" role="region" aria-label="Vote"></div>
    <div id="finalcard"></div>
    <div id="controls"></div>
    <!-- After #takeseat and #votepanel: it steps around them with sibling selectors. -->
    <div id="ctl-legend" role="group" aria-label="Controls"></div>
    <!-- The join screen, over the live arena: the form, the loading state and the reload state share it. -->
    <div id="join" class="show" data-view="form">
      <div class="join-col">
        <p class="join-kicker">Open room · 2v2</p>
        <h1 class="join-mark"><span>Meuss</span> <span>Padel</span> <span>Club</span></h1>
        <form id="join-form" class="join-form" novalidate>
          <label class="join-label" for="nick-input">Nickname</label>
          <input
            id="nick-input"
            maxlength="64"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="go"
            aria-describedby="nick-count nick-msg"
          />
          <div class="join-meta">
            <p id="nick-msg" role="alert"></p>
            <span id="nick-count">0/16</span>
          </div>
          <button id="nick-go" type="submit">Play</button>
        </form>
        <div class="join-loading" role="status" aria-live="polite">
          <div class="join-bar" aria-hidden="true"></div>
          <h2 id="loading-title">Waking up the server…</h2>
          <p>
            The free server sleeps when nobody plays. Waking it can take up to a minute; after
            that it's quick.
          </p>
          <p class="join-hint" id="loading-hint">Connecting…</p>
        </div>
        <ul id="join-controls" class="join-controls" aria-label="Controls"></ul>
        <p id="join-room" class="join-room"></p>
      </div>
    </div>
    <div id="scorebug" class="bug-panel"></div>
    <div id="banner"></div>
    <div id="serveprompt" class="bug-panel" role="status" aria-live="polite"></div>
    <!-- Touch-only devices (phones, tablets): the game needs a keyboard and mouse. Shown by CSS. -->
    <div id="desktop-note" role="note">
      <span>Made for desktop · Play with a keyboard and mouse</span>
      <button type="button" class="dn-close" aria-label="Dismiss">×</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
